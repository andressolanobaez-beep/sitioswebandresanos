<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 96" role="img" aria-label="Caja Futurista">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1428"/>
      <stop offset="1" stop-color="#04080f"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c026a0"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="256" height="92" rx="12" fill="url(#fondo)" stroke="#22d3ee" stroke-width="2"/>
  <rect x="2" y="2" width="256" height="92" rx="12" fill="none" stroke="#c026a0" stroke-width="1" stroke-dasharray="6 6" opacity="0.55"/>

  <!-- pantalla de la caja -->
  <rect x="16" y="20" width="86" height="56" rx="6" fill="#01060e" stroke="#22d3ee" stroke-width="2"/>
  <text x="59" y="46" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#34ffa0" text-anchor="middle">$0.00</text>
  <rect x="24" y="54" width="70" height="4" rx="2" fill="#0891b2"/>
  <rect x="24" y="62" width="46" height="4" rx="2" fill="#c026a0"/>

  <!-- teclado / QR -->
  <g fill="#16233f" stroke="#2b3c5e">
    <rect x="112" y="20" width="12" height="12" rx="2"/>
    <rect x="128" y="20" width="12" height="12" rx="2"/>
    <rect x="144" y="20" width="12" height="12" rx="2"/>
    <rect x="112" y="36" width="12" height="12" rx="2"/>
    <rect x="128" y="36" width="12" height="12" rx="2"/>
    <rect x="144" y="36" width="12" height="12" rx="2"/>
  </g>
  <g fill="#22d3ee">
    <rect x="112" y="52" width="12" height="12" rx="2"/>
    <rect x="128" y="52" width="12" height="12" rx="2"/>
    <rect x="144" y="52" width="12" height="12" rx="2"/>
    <rect x="112" y="68" width="12" height="12" rx="2"/>
    <rect x="144" y="68" width="12" height="12" rx="2"/>
  </g>
  <rect x="128" y="68" width="12" height="12" rx="2" fill="#c026a0"/>

  <!-- texto -->
  <text x="170" y="44" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="17" font-weight="bold" fill="#22d3ee">CAJA</text>
  <text x="170" y="64" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="17" font-weight="bold" fill="url(#magenta)">FUTURISTA</text>
  <rect x="170" y="72" width="72" height="3" rx="1.5" fill="url(#acento)"/>
</svg>
